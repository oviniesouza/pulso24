name: Supabase Keep-Alive

on:
  schedule:
    # Executa a cada 3 dias às 10:00 UTC (07:00 horário de Brasília)
    - cron: '0 10 */3 * *'
  workflow_dispatch: # Permite disparar manualmente pelo botão "Run workflow" no GitHub

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive request
        run: |
          SUPABASE_URL="https://egmxgdvnxrjlrfajufdf.supabase.co"
          API_KEY="${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_O1F3u_HUBtSHmu24N8Up9A_FOcQ083d' }}"
          
          echo "Disparando ping para o Supabase..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/tenants?select=id&limit=1" \
            -H "apikey: ${API_KEY}" \
            -H "Authorization: Bearer ${API_KEY}")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          echo "Status retornado: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Sucesso! O Supabase registrou a atividade."
          else
            echo "Aviso: Resposta inesperada ($HTTP_STATUS), mas a tentativa de conexao foi enviada."
          fi
